[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "product-feed-builder"
version = "0.1.0"
description = "Build Google Merchant Center and Meta catalog product feeds from WooCommerce, Shopify or CSV with validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin", email = "info@saizul.com" }]
keywords = ["google-merchant-center", "meta-catalog", "product-feed", "woocommerce", "shopify", "ecommerce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://saizul.com"

[project.scripts]
feed-builder = "feed_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP031", "UP032", "UP006", "UP007", "UP035", "UP045", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731"]
